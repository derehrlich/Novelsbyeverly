[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/admin/"
  status = 302

[[redirects]]
  from = "/overlay"
  to = "/overlay.html"
  status = 200

[[redirects]]
  from = "/gaming"
  to = "/gaming.html"
  status = 200
