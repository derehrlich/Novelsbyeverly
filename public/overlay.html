<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Co-Working-Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- OBS: Browser-Quelle 1920×1080. Teile wählbar: /overlay?teile=uhr,woerter,tasks,musik,szene (Standard: alles).
     Ohne "szene" ist der Hintergrund durchsichtig. Ton ausschalten: &ton=aus. Vorschau ohne Bot: ?demo=1.
     Position und Größe der Karten, Module und des Kamerafensters stellt der Admin unter "Anordnung" ein.
     Die Kamera in OBS UNTER dieses Overlay legen: das Kamerafenster ist durchsichtig ausgeschnitten. -->
<style>
@font-face { font-family: Fredoka; font-weight: 400; src: url(fonts/fredoka-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 500; src: url(fonts/fredoka-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
:root {
  --papier: rgba(251, 246, 235, .92); --rand: #bba98a; --text: #4d4236; --leise: #8a7b66;
  --fokus: #7f9a74; --pause: #c9985c; --bereit: #a09280; --akzent: #c08a72;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: Fredoka, system-ui, sans-serif; color: var(--text); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
#szene { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.card { position: absolute; background: var(--papier); border: 3px solid var(--rand); border-radius: 26px; box-shadow: 0 10px 26px rgba(50, 40, 28, .22); padding: 16px 24px; }
.klein { font-size: 20px; color: var(--leise); font-weight: 500; }
.bar { height: 14px; border-radius: 8px; background: rgba(120, 100, 70, .16); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--fokus); transition: width .9s ease, background .4s; }

#uhr { left: 36px; top: 28px; width: 330px; }
#uhr .zeit { font-weight: 700; font-size: 76px; line-height: 1; font-variant-numeric: tabular-nums; }
#uhr .oben { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 8px; }
#uhr .datum { display: flex; flex-direction: column; text-align: right; font-size: 21px; line-height: 1.1; color: var(--leise); font-weight: 500; margin-bottom: 8px; }
#uhr .zeile { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.chip { display: inline-block; padding: 3px 14px; border-radius: 20px; font-weight: 700; font-size: 22px; color: #fff; background: var(--bereit); transition: background .4s; }
.phase-focus .chip { background: var(--fokus); } .phase-break .chip { background: var(--pause); }
#uhr .runde { font-size: 20px; color: var(--leise); }
.pomo { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; min-height: 22px; }
.pomo i { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #c9988f; background: transparent; position: relative; }
.pomo i::after { content: ''; position: absolute; left: 6px; top: -7px; width: 9px; height: 7px; border-radius: 6px 6px 0 0; background: #7f9a74; opacity: 0; }
.pomo i.fertig { background: #c7766a; border-color: #a95c52; } .pomo i.fertig::after, .pomo i.aktiv::after { opacity: 1; }
.pomo i.aktiv { background: conic-gradient(#c7766a var(--p, 0%), rgba(199, 118, 106, .12) 0); }
#uhr .rest { font-weight: 700; font-size: 58px; line-height: 1.05; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
#uhr.phase-break .bar i { background: var(--pause); } #uhr.phase-idle .bar i { background: var(--bereit); }
#uhr.phase-idle .rest { font-size: 30px; font-family: Fredoka; font-weight: 600; color: var(--leise); padding: 12px 0 14px; }

#woerter { right: 36px; top: 28px; width: 360px; }
#woerter .kopf { display: flex; justify-content: space-between; align-items: baseline; }
#woerter .label { font-size: 24px; font-weight: 600; }
#woerter .zahl { font-weight: 700; font-size: 84px; line-height: 1.02; font-variant-numeric: tabular-nums; }
#woerter .ziel { font-size: 22px; color: var(--leise); }
#woerter .bar { margin: 8px 0 10px; }
#woerter.geschafft .bar i { background: #d3a85a; } #woerter.geschafft .zahl { color: #a9783a; }
#woerter .sprint { display: inline-block; background: var(--fokus); color: #fff; border-radius: 14px; padding: 1px 12px; font-weight: 700; font-size: 20px; margin-bottom: 6px; }
#woerter .sprint[hidden] { display: none; }

#tasks { left: 36px; top: 300px; width: 330px; padding-top: 14px; padding-bottom: 14px; }
#tasks h3 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
#tasks ul { list-style: none; padding: 0; }
#tasks li { display: flex; gap: 10px; align-items: center; font-size: 22px; line-height: 1.2; padding: 3px 0; font-weight: 500; white-space: nowrap; }
#tasks li span { overflow: hidden; text-overflow: ellipsis; }
#tasks li::before { content: ''; flex: none; width: 20px; height: 20px; border: 3px solid var(--rand); border-radius: 6px; background: #fffdf6; }
#tasks li.fertig { color: var(--leise); text-decoration: line-through; }
#tasks li.fertig::before { background: var(--fokus); border-color: var(--fokus); content: '✓'; color: #fff; font-size: 16px; line-height: 14px; text-align: center; text-decoration: none; }
#tasks li.leer { color: var(--leise); font-size: 20px; }
#tasks li.leer::before { display: none; }

#musik { left: 36px; top: 700px; width: 380px; display: flex; gap: 16px; align-items: center; padding: 14px 20px; }
#musik .cover { width: 84px; height: 84px; flex: none; border-radius: 18px; object-fit: cover; background: linear-gradient(135deg, #d9c3a6, #a9bfa0); box-shadow: 0 4px 12px rgba(50, 40, 28, .22); }
#musik .info { min-width: 0; flex: 1; }
#musik .kopf { font-size: 16px; font-weight: 600; color: var(--leise); letter-spacing: .06em; text-transform: uppercase; }
#musik .titel { font-size: 24px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#musik .kuenstler { font-size: 19px; color: var(--leise); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#musik .eq { display: flex; gap: 4px; align-items: flex-end; height: 34px; flex: none; }
#musik .eq i { width: 6px; border-radius: 3px; background: var(--fokus); animation: eq 1s ease-in-out infinite; }
#musik .eq i:nth-child(2) { animation-delay: -.3s; background: #c9a45f; } #musik .eq i:nth-child(3) { animation-delay: -.6s; } #musik .eq i:nth-child(4) { animation-delay: -.15s; background: #c08a72; }
@keyframes eq { 0%, 100% { height: 8px; } 50% { height: 32px; } }
@media (prefers-reduced-motion: reduce) { #musik .eq i { animation: none; height: 18px; } }
#kamera { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: linear-gradient(135deg, #3d4a45, #2a302d); color: #cdd8d0; font-size: 34px; font-weight: 600; letter-spacing: .04em; }
.name { position: absolute; width: 230px; margin-left: -115px; transform: translateY(-100%); text-align: center; pointer-events: none; transition: opacity .3s; }
.name .n { display: inline-block; max-width: 230px; background: rgba(255, 248, 235, .92); border: 2px solid var(--rand); border-radius: 16px; padding: 1px 13px; font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 12px rgba(50, 40, 28, .2); }
.name .n small { font-size: 15px; color: var(--leise); font-weight: 500; margin-left: 6px; }
.name .t { display: block; margin: 3px auto 0; width: fit-content; max-width: 220px; background: #f6e9b4; border-radius: 6px; padding: 0 9px; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 3px 8px rgba(50, 40, 28, .18); transform: rotate(-1.5deg); }
.name .t.fertig { background: #d6e5cc; text-decoration: line-through; }

#banner { position: absolute; left: 50%; top: 40px; width: 640px; margin-left: -320px; display: flex; flex-direction: column; gap: 12px; align-items: center; pointer-events: none; }
.ereignis { width: 100%; background: var(--papier); border: 3px solid var(--rand); border-radius: 28px; box-shadow: 0 12px 30px rgba(50, 40, 28, .26); padding: 14px 26px; display: flex; gap: 18px; align-items: center; animation: rein .5s cubic-bezier(.2, 1.3, .4, 1) both; }
.ereignis.raus { animation: raus .5s ease-in both; }
.ereignis .icon { font-size: 52px; line-height: 1; }
.ereignis .titel { font-size: 32px; font-weight: 700; }
.ereignis .sub { font-size: 23px; color: var(--leise); font-weight: 500; }
.ereignis.gold { background: #f8efd2; border-color: #c9a45f; }
.modul { position: absolute; transform: translateX(-50%); background: var(--papier); border: 2px solid var(--rand); border-radius: 12px; padding: 0 11px; font-size: 16px; line-height: 20px; font-weight: 600; color: var(--text); white-space: nowrap; box-shadow: 0 3px 8px rgba(50, 40, 28, .2); }
.modul small { color: var(--leise); font-weight: 500; font-size: 14px; margin-right: 6px; }
@keyframes rein { from { transform: translateY(-140px) scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes raus { to { transform: translateY(-120px); opacity: 0; } }
#konfetti { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }

/* ---- Glas-Stil (Einstellung „Stil der Karten“): durchsichtige, getönte Kacheln, die das Bild dahinter verschwimmen lassen.
   --glas = Tönung, --glas-a = Stärke in Prozent, --glas-blur = Unschärfe. Werte kommen aus dem Admin (Seite „Design und Hintergrund“). */
#bg { position: absolute; inset: 0; width: 1920px; height: 1080px; background-size: cover; background-position: center; }
body.glas { --text: #fff; --leise: rgba(255, 255, 255, .74); --rand: rgba(255, 255, 255, .42); --fokus: rgba(255, 255, 255, .95); --pause: #ffd9a0; --bereit: rgba(255, 255, 255, .5); }
body.glas .card, body.glas .ereignis, body.glas .modul {
  background: linear-gradient(135deg, rgba(255, 255, 255, .26) 0%, rgba(255, 255, 255, .05) 46%, rgba(255, 255, 255, .1) 100%),
    color-mix(in srgb, var(--glas, #3b6f94) calc(var(--glas-a, 38) * 1%), transparent);
  -webkit-backdrop-filter: blur(var(--glas-blur, 22px)) saturate(1.5); backdrop-filter: blur(var(--glas-blur, 22px)) saturate(1.5);
  border: 1.5px solid rgba(255, 255, 255, .34); border-top-color: rgba(255, 255, 255, .62); border-left-color: rgba(255, 255, 255, .5);
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .5), inset 0 -14px 28px rgba(255, 255, 255, .05), 0 18px 44px rgba(10, 25, 40, .34);
  color: #fff; text-shadow: 0 1px 8px rgba(10, 25, 40, .28);
}
body.glas .card { border-radius: 38px; }
body.glas .card > *, body.glas .ereignis > * { position: relative; }
body.glas .card::before, body.glas .ereignis::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(118deg, rgba(255, 255, 255, .3) 0%, rgba(255, 255, 255, .06) 34%, rgba(255, 255, 255, 0) 52%); pointer-events: none; }
body.glas .ereignis { position: relative; border-radius: 40px; }
body.glas .ereignis.gold { background: linear-gradient(135deg, rgba(255, 236, 190, .4), rgba(255, 255, 255, .06)), color-mix(in srgb, #d9a64a calc(var(--glas-a, 38) * 1%), transparent); }
body.glas .modul { border-radius: 16px; }
body.glas .bar { background: rgba(255, 255, 255, .2); box-shadow: inset 0 1px 2px rgba(10, 25, 40, .18); }
body.glas .bar i { background: linear-gradient(180deg, #fff, rgba(255, 255, 255, .8)); box-shadow: 0 0 12px rgba(255, 255, 255, .5); }
body.glas .chip { background: rgba(255, 255, 255, .26); border: 1px solid rgba(255, 255, 255, .45); }
body.glas .phase-focus .chip { background: rgba(255, 255, 255, .9); color: #1d4560; text-shadow: none; }
body.glas .phase-break .chip { background: rgba(255, 217, 160, .9); color: #5a3a10; text-shadow: none; }
body.glas .pomo i { border-color: rgba(255, 255, 255, .6); }
body.glas .pomo i.fertig { background: #fff; border-color: #fff; } body.glas .pomo i.aktiv { background: conic-gradient(#fff var(--p, 0%), rgba(255, 255, 255, .14) 0); }
body.glas #woerter.geschafft .zahl { color: #ffe6a8; } body.glas #woerter.geschafft .bar i { background: #ffe6a8; }
body.glas #woerter .sprint { background: rgba(255, 255, 255, .9); color: #1d4560; text-shadow: none; }
body.glas #tasks li::before { border-color: rgba(255, 255, 255, .8); background: rgba(255, 255, 255, .12); }
body.glas #tasks li.fertig::before { background: #fff; border-color: #fff; color: #1d4560; }
body.glas #musik .cover { box-shadow: 0 6px 18px rgba(10, 25, 40, .35); border: 1px solid rgba(255, 255, 255, .4); }
body.glas #musik .eq i, body.glas #musik .eq i:nth-child(n) { background: rgba(255, 255, 255, .92); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="kamera" hidden>Kamera</div>
  <div id="bg" hidden></div>
  <canvas id="szene" hidden></canvas>
  <div id="namen"></div>
  <div id="module"></div>
  <section class="card phase-idle" id="uhr" hidden>
    <div class="oben"><div class="zeit" id="zeit">--:--</div><div class="datum"><span id="tag"></span><span id="datum"></span></div></div>
    <div class="zeile"><span class="chip" id="chip">Bereit</span><span class="runde" id="runde"></span></div>
    <div class="rest" id="rest">Gleich geht's los</div>
    <div class="bar"><i id="fortschritt"></i></div>
    <div class="pomo" id="pomo"></div>
  </section>
  <section class="card" id="woerter" hidden>
    <div class="kopf"><span class="label" id="wlabel">Wörter heute</span><span class="ziel" id="ziel"></span></div>
    <div class="zahl" id="zahl">0</div>
    <div class="bar"><i id="wbalken"></i></div>
    <div class="sprint" id="sprint" hidden></div>
    <div class="klein" id="gemeinsam"></div>
  </section>
  <section class="card" id="tasks" hidden>
    <h3>To-Do</h3>
    <ul id="liste"></ul>
  </section>
  <section class="card" id="musik" hidden>
    <img class="cover" id="cover" alt="" hidden>
    <div class="info"><div class="kopf">Jetzt läuft</div><div class="titel" id="titel"></div><div class="kuenstler" id="kuenstler"></div></div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </section>
  <div id="banner"></div>
  <canvas id="konfetti" width="1920" height="1080"></canvas>
</div>

<script type="module">
import { Szene, seatPos, moduleLayout } from './js/szene.mjs';
import { nowPlaying } from './js/jetztlaeuft.mjs';

const q = new URLSearchParams(location.search);
const teile = new Set((q.get('teile') ?? 'uhr,woerter,tasks,musik,szene').split(',').map((s) => s.trim()));
const ton = q.get('ton') !== 'aus';
const demo = q.has('demo');
const $ = (id) => document.getElementById(id);
if (teile.has('szene')) $('szene').hidden = false;

// ---- Bühne an das Fenster anpassen
const stage = $('stage');
const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
addEventListener('resize', fit); fit();

const szene = teile.has('szene') ? new Szene($('szene')) : null;
const fmt = new Intl.NumberFormat('de-DE');
let view = null, cursor = null, offset = 0;
let shownWords = 0, targetWords = 0, zielNumerisch = true;
let musikNow = null, musikBusy = false;

// ---- Ton: kleines Glockenspiel mit WebAudio (OBS: "Audio über OBS steuern" aktivieren)
let audio = null;
function chime(notes = [660, 880, 1320], gap = 0.16) {
  if (!ton) return;
  try {
    audio ??= new AudioContext();
    notes.forEach((f, i) => {
      const t = audio.currentTime + i * gap, o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 1.2);
    });
  } catch { /* ohne Ton weiter */ }
}

// ---- Konfetti
const kc = $('konfetti').getContext('2d');
let parts = [];
function burst(x, y, n = 80, spread = 1) {
  const cols = ['#d9a6a4', '#e3cf91', '#9db4bf', '#a3b896', '#b6a4c4', '#d9a77c'];
  for (let i = 0; i < n; i += 1) {
    const a = Math.random() * Math.PI * 2, v = (4 + Math.random() * 9) * spread;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: 6 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 0 });
  }
}
function stepConfetti() {
  kc.clearRect(0, 0, 1920, 1080);
  parts = parts.filter((p) => p.life < 150 && p.y < 1100);
  for (const p of parts) {
    p.life += 1; p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    kc.save(); kc.translate(p.x, p.y); kc.rotate(p.rot); kc.globalAlpha = Math.min(1, (150 - p.life) / 40);
    kc.fillStyle = p.c; kc.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); kc.restore();
  }
}

// ---- Banner
const queue = [];
let showing = false;
function banner(icon, titel, sub = '', { gold = false, sound = true, confetti = 0 } = {}) {
  queue.push({ icon, titel, sub, gold, sound, confetti });
  if (!showing) nextBanner();
}
function nextBanner() {
  const b = queue.shift();
  if (!b) { showing = false; return; }
  showing = true;
  const el = document.createElement('div');
  el.className = `ereignis${b.gold ? ' gold' : ''}`;
  el.innerHTML = '<div class="icon"></div><div><div class="titel"></div><div class="sub"></div></div>';
  el.querySelector('.icon').textContent = b.icon; el.querySelector('.titel').textContent = b.titel; el.querySelector('.sub').textContent = b.sub;
  el.querySelector('.sub').hidden = !b.sub;
  $('banner').append(el);
  if (b.sound) chime();
  if (b.confetti) burst(960, 140, b.confetti, 1.3);
  setTimeout(() => el.classList.add('raus'), 5200);
  setTimeout(() => { el.remove(); nextBanner(); }, 5700);
}

function handleEvent(ev) {
  szene?.event(ev);
  switch (ev.type) {
    case 'sprint': banner(ev.early ? '⏹️' : '🍅', ev.early ? 'Pomodoro beendet' : `Pomodoro ${ev.n ?? ''}${ev.goal ? ` von ${ev.goal}` : ''} geschafft!`.replace('  ', ' '), [`${ev.minutes} Min`, ev.streamerWords ? `+${fmt.format(ev.streamerWords)} Wörter` : '', ev.writers ? `${ev.writers} Mitschreibende` : ''].filter(Boolean).join(' · '), { confetti: ev.early ? 0 : 140, sound: !ev.early }); break;
    case 'phase': if (ev.phase === 'focus') banner('✍️', 'Pomodoro startet', `${ev.minutes} Minuten schreiben`, { sound: true }); else if (ev.phase === 'break') banner(ev.long ? '🌿' : '☕', ev.long ? 'Lange Pause' : 'Pause', `${ev.minutes} Minuten durchatmen`, { sound: false }); break;
    case 'goal': banner('🎯', 'Tagesziel erreicht!', `${fmt.format(ev.words)} Wörter`, { gold: true, confetti: 220 }); break;
    case 'rankup': banner('⭐', `${ev.name} ist jetzt „${ev.rank}“`, 'Neuer Rang!', { gold: true, confetti: 100 }); break;
    case 'unlock': banner('🎁', `${ev.name}: ${ev.item}`, 'freigeschaltet', { confetti: 60 }); break;
    case 'deko': banner('🌿', `${ev.item} im Zimmer`, 'Das Zimmer wächst durch eure gemeinsame Arbeitszeit', { gold: true, confetti: 100 }); break;
    case 'checkin': banner(ev.milestone ? '🏆' : '✅', `${ev.name} ist eingecheckt`, [`Besuch ${ev.count}`, ev.streak > 1 ? `🔥 ${ev.streak} Streams in Folge` : ''].filter(Boolean).join(' · '), { gold: ev.milestone, confetti: ev.milestone ? 180 : 0 }); break;
    case 'taskdone': burst(200, 380, 40, .7); break;
    case 'sit': if (teile.has('szene')) chime([880], 0); break;
    default: break;
  }
}

// ---- Anzeige
const pad = (n) => String(n).padStart(2, '0');
function renderNames() {
  const box = $('namen');
  if (!szene || bildModus) { box.textContent = ''; return; }
  const seen = new Set();
  for (const s of view.seats) {
    seen.add(s.id);
    let el = box.querySelector(`[data-id="${CSS.escape(s.id)}"]`);
    if (!el) { el = document.createElement('div'); el.className = 'name'; el.dataset.id = s.id; el.innerHTML = '<span class="n"></span><span class="t" hidden></span>'; box.append(el); }
    const { x, ty } = seatPos(s.slot);
    el.style.left = `${x}px`; el.style.top = `${ty - 174}px`;
    const n = el.querySelector('.n');
    if (n.dataset.v !== `${s.name}|${s.rank}`) { n.dataset.v = `${s.name}|${s.rank}`; n.textContent = s.name; if (s.rank) { const sm = document.createElement('small'); sm.textContent = s.rank; n.append(sm); } }
    const task = s.tasks.find((t) => !t.done) ?? s.tasks.at(-1);
    const t = el.querySelector('.t');
    t.hidden = !task; if (task) { t.textContent = task.text; t.classList.toggle('fertig', task.done); }
  }
  for (const el of [...box.children]) if (!seen.has(el.dataset.id)) el.remove();
}

function renderModules() {
  const box = $('module');
  if (!szene || bildModus) { box.textContent = ''; return; }
  const layout = moduleLayout(view.modules, view.layout, view.modus);
  const keep = new Set(layout.map((m) => m.id));
  for (const m of layout) {
    let el = box.querySelector(`[data-m="${m.id}"]`);
    if (!el) { el = document.createElement('div'); el.className = 'modul'; el.dataset.m = m.id; box.append(el); }
    el.style.left = `${m.x}px`; el.style.top = `${view.modus === 'wachstum' ? m.y + 30 * m.s : m.y - 1}px`; el.style.transform = `translateX(-50%) scale(${Math.max(0.8, m.s)})`; el.style.transformOrigin = 'top center';
  }
  for (const el of [...box.children]) if (!keep.has(el.dataset.m)) el.remove();
  updateModuleLabels();
}
function updateModuleLabels() {
  if (!view) return;
  const set = (id, small, text) => { const el = $('module').querySelector(`[data-m="${id}"]`); if (!el) return; const v = `${small}|${text}`; if (el.dataset.v === v) return; el.dataset.v = v; el.textContent = ''; const sm = document.createElement('small'); sm.textContent = small; el.append(sm, text); };
  const w = view.words;
  const goal = w.goal || 1000;
  set('blume', 'Blume', `${Math.round((view.progress ?? w.today / goal) * 100)} %`);
  const t = view.timer;
  const left = t.phase === 'idle' ? 0 : Math.max(0, Math.ceil((t.endsAt - (Date.now() + offset)) / 1000));
  set('kerze', 'Kerze', t.phase === 'focus' ? `${pad(Math.floor(left / 60))}:${pad(left % 60)}` : t.phase === 'break' ? 'Pause' : 'bereit');
  set('buecher', 'Pomodoros', String(view.sprintsToday ?? 0));
}

function renderTasks() {
  const ul = $('liste');
  const items = view.streamerTasks;
  ul.textContent = '';
  if (!items.length) { const li = document.createElement('li'); li.className = 'leer'; li.textContent = 'Noch nichts geplant'; ul.append(li); return; }
  for (const t of items.slice(view.modus === 'zimmer' ? -3 : -7)) { const li = document.createElement('li'); const sp = document.createElement('span'); sp.textContent = t.text; li.append(sp); if (t.done) li.className = 'fertig'; ul.append(li); }
}

function renderWords() {
  const z = view.ziel ?? { art: 'woerter', label: 'Wörter heute', numeric: true, current: view.words.today, goal: view.words.goal, fraction: view.words.goal ? view.words.today / view.words.goal : 0 };
  $('wlabel').textContent = z.label;
  zielNumerisch = z.numeric;
  if (z.numeric) { targetWords = z.current; $('ziel').textContent = z.goal ? `Ziel ${fmt.format(z.goal)}` : ''; }
  else $('ziel').textContent = `Ziel ${z.goalText} Std`;
  $('wbalken').style.width = `${Math.min(100, (z.fraction || 0) * 100)}%`;
  $('woerter').classList.toggle('geschafft', z.goal > 0 && z.fraction >= 1);
  const sprint = z.art === 'woerter' && view.timer.phase === 'focus' ? Math.max(0, view.words.today - view.timer.wordsAtStart) : 0;
  $('sprint').hidden = !(z.art === 'woerter' && view.timer.phase === 'focus');
  $('sprint').textContent = `Pomodoro +${fmt.format(sprint)}`;
  const bits = [];
  if (z.art === 'zeit') bits.push(z.startedAt ? (z.quelle === 'twitch' ? 'seit Streambeginn' : 'läuft') : 'noch nicht gestartet');
  if (view.modus === 'zimmer' && view.communityHours) bits.push(`Zimmer ${view.communityHours} Std`);
  if (view.words.chat) bits.push(`Chat ${fmt.format(view.words.chat)} Wörter`);
  $('gemeinsam').textContent = bits.join(' · ');
}

function renderTimer() {
  const t = view.timer;
  const card = $('uhr');
  card.className = `card phase-${t.phase}`;
  $('chip').textContent = t.phase === 'focus' ? 'Fokus' : t.phase === 'break' ? 'Pause' : 'Bereit';
  const pm = view.pomodoro ?? { done: 0, goal: 0 };
  $('runde').textContent = t.phase === 'focus' ? `Pomodoro ${pm.done + 1}${pm.goal ? ` von ${pm.goal}` : ''}` : pm.goal ? `${pm.done} von ${pm.goal} geschafft` : pm.done ? `${pm.done} geschafft` : '';
  const total = pm.goal > 0 ? pm.goal : Math.max(4, pm.done + 1);
  const box = $('pomo');
  while (box.children.length < total) box.append(document.createElement('i'));
  while (box.children.length > total) box.lastChild.remove();
  [...box.children].forEach((el, i) => { el.className = i < pm.done ? 'fertig' : i === pm.done && t.phase === 'focus' ? 'aktiv' : ''; });
}

function tickClock() {
  const d = new Date();
  $('zeit').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('tag').textContent = d.toLocaleDateString('de-DE', { weekday: 'short' });
  $('datum').textContent = d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
  if (!view) return;
  updateModuleLabels();
  const z = view.ziel;
  if (z && !z.numeric) {
    const ms = z.startedAt ? Math.max(0, Date.now() + offset - z.startedAt) : 0, m = Math.floor(ms / 60000);
    $('zahl').textContent = `${Math.floor(m / 60)}:${pad(m % 60)}`;
    $('wbalken').style.width = `${Math.min(100, (ms / (z.goalMinutes * 60000)) * 100)}%`;
  }
  const t = view.timer;
  if (t.phase === 'idle') { $('rest').textContent = "Gleich geht's los"; $('fortschritt').style.width = '0%'; return; }
  const now = Date.now() + offset;
  const left = Math.max(0, t.endsAt - now);
  const s = Math.ceil(left / 1000);
  $('rest').textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  const frac = Math.min(1, (now - t.startedAt) / (t.endsAt - t.startedAt));
  $('fortschritt').style.width = `${frac * 100}%`;
  const act = $('pomo').querySelector('.aktiv'); if (act) act.style.setProperty('--p', `${Math.round(frac * 100)}%`);
}

// ---- Anordnung (Position und Größe aus dem Admin) und Sichtbarkeit
const KARTEN = ['uhr', 'woerter', 'tasks', 'musik'];
function applyLayout() {
  const L = view?.layout;
  if (!L) return;
  for (const id of KARTEN) {
    const el = $(id), l = L[id];
    if (!l) continue;
    el.style.left = `${l.x}px`; el.style.top = `${l.y}px`; el.style.right = 'auto';
    el.style.transformOrigin = 'top left'; el.style.transform = `scale(${l.s})`;
    el.hidden = !(teile.has(id) && l.on && (id !== 'musik' || musikNow));
  }
  const k = L.kamera, ph = $('kamera');
  ph.hidden = !(q.has('kamera') || q.has('editor') || demo) || !k?.on;
  if (k) { ph.style.left = `${k.x}px`; ph.style.top = `${k.y}px`; ph.style.width = `${k.w}px`; ph.style.height = `${k.h}px`; }
}

// ---- Musik
async function updateMusik() {
  const m = view?.musik;
  if (!m) musikNow = null;
  else if (m.mode === 'server') musikNow = m.now ?? null;
  else if (!musikBusy) { // das Overlay liest die Adresse selbst (z. B. Tuna auf demselben PC)
    musikBusy = true;
    try { const r = await fetch(m.url, { cache: 'no-store' }); musikNow = nowPlaying(await r.json()); } catch { musikNow = null; }
    musikBusy = false;
  }
  renderMusik();
}
function renderMusik() {
  const m = musikNow;
  $('titel').textContent = m?.title ?? ''; $('kuenstler').textContent = m?.artist ?? '';
  const img = $('cover'); img.hidden = !m?.cover; if (m?.cover && img.src !== m.cover) img.src = m.cover;
  applyLayout();
}

// Stil (Papier oder Glas) und Hintergrund (Landschaft oder eigenes Bild)
let bildModus = false;
function applyDesign() {
  const v = view;
  document.body.classList.toggle('glas', v.stil === 'glas');
  const g = v.glas ?? {};
  document.body.style.setProperty('--glas', g.farbe ?? '#3b6f94');
  document.body.style.setProperty('--glas-a', String(g.staerke ?? 38));
  document.body.style.setProperty('--glas-blur', `${g.unschaerfe ?? 22}px`);
  bildModus = v.hintergrund?.mode === 'bild';
  const bg = $('bg');
  bg.hidden = !(bildModus && teile.has('szene'));
  if (bildModus) { const url = `url("${v.hintergrund.url}")`; if (bg.style.backgroundImage !== url) bg.style.backgroundImage = url; }
  $('szene').hidden = !teile.has('szene') || bildModus;
}

function apply(data) {
  const first = view === null;
  offset = data.now - Date.now();
  view = data;
  for (const ev of data.events ?? []) handleEvent(ev);
  if (data.cursor) cursor = data.cursor;
  applyDesign();
  if (!bildModus) szene?.update(view);
  renderNames(); renderModules(); renderTasks(); renderWords(); renderTimer(); applyLayout();
  updateMusik();
  if (first) shownWords = targetWords;
}

// ---- Anordnungs-Editor im Admin schickt neue Positionen, damit man sie live sieht
if (q.has('editor')) addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'layout' && view) { view.layout = e.data.layout; if (!bildModus) szene?.update(view); renderModules(); applyLayout(); }
  // Vorschau im Admin: ganzer Stand mit noch nicht gespeicherten Einstellungen (siehe /api/admin/preview)
  if (e.data?.type === 'view' && e.data.view) apply({ ...e.data.view, events: [] });
});

// ---- Abrufen
async function poll() {
  try {
    const res = await fetch(`/api/overlay${cursor ? `?since=${encodeURIComponent(cursor)}` : ''}`, { cache: 'no-store' });
    if (res.ok) apply(await res.json());
  } catch { /* beim nächsten Mal wieder */ }
}
if (q.has('vorschau')) {
  // Vorschau im Admin: kein Abrufen, der Admin schickt den Stand per Nachricht
  parent.postMessage({ type: 'overlay-ready' }, location.origin);
} else if (demo) {
  // Vorschau ohne Bot: Beispieldaten
  const { DEFAULT_LAYOUT } = await import('./js/layout.mjs');
  const mk = () => ({
    now: Date.now(), modus: 'wachstum', jahreszeit: q.get('jahreszeit') ?? 'fruehling', tageszeit: q.get('tageszeit') ?? 'mittag', progress: Number(q.get('fortschritt') ?? 0.55),
    scene: 'cafe', deco: [], modules: { blume: true, kerze: true, buecher: true }, sprintsToday: 3, layout: DEFAULT_LAYOUT,
    pomodoro: { done: 3, goal: 6, minutes: 25 }, ziel: { art: 'woerter', label: 'Wörter heute', numeric: true, current: 1234, goal: 2000, fraction: 0.617 }, stefanie: { figur: { haut: '2', haare: 'braun', frisur: 'lang', oberteil: 'gruen', kopf: 'keine', gesicht: 'brille', hals: 'keine', tier: 'keine', tisch: 'laptop', getraenk: 'tee' }, taetigkeit: 'laptop' }, musik: { mode: 'server', now: { title: 'Rainy Café', artist: 'Mondschein', cover: '' } },
    timer: { phase: q.get('phase') ?? 'focus', round: 4, startedAt: Date.now() - 7 * 60000, endsAt: Date.now() + 18 * 60000, wordsAtStart: 640 },
    words: { today: 1234, goal: 2000, chat: 0 }, communityHours: 0,
    streamerTasks: [{ id: 'a', text: 'Kapitel 12 schreiben', done: true }, { id: 'b', text: 'Szene im Café überarbeiten', done: false }, { id: 'c', text: 'Klappentext entwerfen', done: false }],
    seats: [], events: [], cursor: 'x',
  });
  apply(mk());
  if (q.get('ereignis')) setTimeout(() => handleEvent({ type: q.get('ereignis'), writers: 6, minutes: 25, streamerWords: 420, words: 2000, name: 'Lena', rank: 'Federkiel', item: 'Katze' }), 300);
} else {
  await poll();
  setInterval(poll, 3000);
}

// ---- Schleifen
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - last < 70) return; // ca. 14 Bilder pro Sekunde reichen für Pixel-Optik
  last = t;
  if (szene && view && !bildModus) szene.draw(t);
  if (shownWords !== targetWords) { shownWords += (targetWords - shownWords) * 0.12; if (Math.abs(targetWords - shownWords) < 1) shownWords = targetWords; }
  if (zielNumerisch) $('zahl').textContent = fmt.format(Math.round(shownWords));
  stepConfetti();
}
requestAnimationFrame(frame);
setInterval(tickClock, 250); tickClock();
</script>
