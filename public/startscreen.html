<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Startbildschirm</title>
<style>
  /* Startbildschirm als OBS-Browserquelle (1920×1080), füllt das ganze Bild.
     Starten, verlängern und beenden: im Admin (Stream → Startbildschirm). Bis dahin bleibt die Seite unsichtbar.
     Hintergrundbild oder animierte HTML-Datei, Texte, Vorlauf und Schreib-Sprüche stellst du dort ein.
     ?demo     Beispiel mit 3 Minuten, immer sichtbar
     ?bg=0     ohne eigenen Hintergrund (durchsichtig), deine Landschaft oder Szene bleibt sichtbar */
  @font-face { font-family: Fredoka; font-weight: 400; src: url(fonts/fredoka-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 500; src: url(fonts/fredoka-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
  :root { --papier: rgba(251, 246, 235, .96); --rand: #bba98a; --text: #4d4236; --leise: #8a7b66; --gold: #e0b45a; --creme: #fbf3df; }
  html { font-size: .8333vw; } /* 1 rem = 16 px bei 1920 Pixel Breite, alles skaliert mit */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: Fredoka, system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; opacity: 0; transition: opacity .9s; overflow: hidden; color: var(--creme); }
  #scene.on { opacity: 1; }

  /* Hintergrund: eigenes Bild oder Animation, sonst ein warmer Abend mit Lampenschein und schwebenden Lichtern */
  #bg { position: absolute; inset: 0; background: #2b2018 center / cover no-repeat; }
  #bg.plain { background: radial-gradient(ellipse at 50% 38%, #6a4a35 0%, #3d2b21 45%, #20160f 100%); }
  #bg iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  #lichter { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .licht { position: absolute; bottom: -2rem; width: .7rem; height: .7rem; border-radius: 50%; background: #ffe7a8; box-shadow: 0 0 1.2rem .5rem rgba(255, 224, 150, .55); opacity: 0; animation: steig linear infinite; }
  @keyframes steig { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: .85; } 100% { transform: translate(var(--dx), -118vh); opacity: 0; } }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(20, 12, 6, .18) 0%, rgba(20, 12, 6, .62) 100%); }

  #main { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 8rem; box-sizing: border-box; text-align: center; z-index: 2; }
  .title { font-size: 6.6rem; font-weight: 700; line-height: 1.05; color: var(--creme); text-shadow: 0 .3rem 0 rgba(30, 18, 8, .75), 0 0 3rem rgba(224, 180, 90, .4); overflow-wrap: anywhere; }
  .sub { margin-top: .9rem; font-size: 2.4rem; font-weight: 500; color: #e8d8b8; text-shadow: 0 .15rem 0 rgba(0, 0, 0, .6); min-height: 1.2em; }

  /* Karte mit der Restzeit */
  .karte { margin-top: 2.6rem; padding: 1.3rem 5.5rem 1.8rem; border-radius: 2.6rem; background: var(--papier); border: .35rem solid var(--rand); box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, .45), inset 0 0 0 .5rem rgba(255, 255, 255, .5); color: var(--text); }
  .karte small { display: block; font-size: 1.6rem; font-weight: 600; letter-spacing: .25rem; text-transform: uppercase; color: var(--leise); }
  .time { font-size: 12rem; font-weight: 700; line-height: 1.05; letter-spacing: .3rem; font-variant-numeric: tabular-nums; }
  .karte.done .time { font-size: 5.4rem; padding: 1.2rem 0; color: #a8742f; }
  .karte.done small { display: none; }

  /* Schreib-Fortschritt */
  .progress { width: 70rem; margin-top: 2.5rem; }
  .bar { position: relative; height: 2rem; border-radius: 1rem; background: rgba(20, 12, 6, .55); border: .2rem solid rgba(251, 243, 223, .55); }
  .fill { height: 100%; width: 0; border-radius: .8rem; background: linear-gradient(90deg, #e0b45a, #f3d58a); transition: width 1s linear; }
  .stift { position: absolute; top: -2.5rem; left: 0; font-size: 3rem; line-height: 1; transform: translateX(-50%) rotate(-10deg); transition: left 1s linear; filter: drop-shadow(0 .2rem 0 rgba(0, 0, 0, .55)); }
  .phase { margin-top: .9rem; font-size: 1.8rem; font-weight: 500; color: #e8d8b8; text-shadow: 0 .1rem 0 rgba(0, 0, 0, .6); }

  /* Schreib-Sprüche: eine Karte, die zwischendurch wechselt */
  .spruch { position: relative; width: 64rem; max-width: 100%; min-height: 9.8rem; margin-top: 2.3rem; padding: 1.1rem 2.4rem 1.4rem; box-sizing: border-box; border-radius: 1.8rem; background: rgba(251, 246, 235, .93); border: .25rem solid var(--rand); border-left: .6rem solid var(--gold); text-align: left; color: var(--text); opacity: 0; transform: translateY(1rem); transition: opacity .6s, transform .6s; box-shadow: 0 .8rem 2rem rgba(0, 0, 0, .35); }
  .spruch.in { opacity: 1; transform: none; }
  .spruch .head { font-size: 2rem; font-weight: 700; line-height: 1.2; color: #a8742f; }
  .spruch .head:empty { display: none; }
  .spruch .body { margin-top: .3rem; font-size: 2rem; font-weight: 500; line-height: 1.3; }
  .spruch .ico { position: absolute; right: 1.4rem; top: .8rem; font-size: 2.2rem; opacity: .85; }

  /* Variante „?bg=0“: durchsichtig, nur ein leichter Schleier hinter dem Text */
  body.clear #bg, body.clear #lichter { display: none; }
  body.clear #shade { background: radial-gradient(ellipse at center, rgba(20, 12, 6, .5) 0%, rgba(20, 12, 6, .12) 80%); }
</style>
</head>
<body>
<div id="scene" aria-live="off">
  <div id="bg" class="plain"></div>
  <div id="lichter"></div>
  <div id="shade"></div>
  <div id="main">
    <div class="title" id="title">Gleich geht’s los!</div>
    <div class="sub" id="sub"></div>
    <div class="karte" id="karte"><small>Das Schreibzimmer öffnet in</small><div class="time" id="time">10:00</div></div>
    <div class="progress" id="progress">
      <div class="bar"><div class="fill" id="fill"></div><div class="stift" id="stift">✍️</div></div>
      <div class="phase" id="phase"></div>
    </div>
    <div class="spruch" id="spruch"><span class="ico">📖</span><div class="head" id="sHead"></div><div class="body" id="sBody"></div></div>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
document.body.classList.toggle('clear', params.get('bg') === '0');
const $ = (id) => document.getElementById(id);
const two = (n) => String(n).padStart(2, '0');
const PHASES = [[0, '☕ Der Kaffee wird gekocht'], [15, '✏️ Die Stifte werden gespitzt'], [30, '📖 Das Notizbuch wird aufgeschlagen'], [60, '🕯️ Die Kerze wird angezündet'], [80, '💭 Die Ideen sammeln sich'], [95, '✨ Gleich die erste Zeile!']];

// schwebende Lichter (nur beim eingebauten Hintergrund sichtbar)
for (let i = 0; i < 26; i += 1) {
  const l = document.createElement('div'); l.className = 'licht';
  l.style.cssText = `left:${Math.random() * 100}%;--dx:${(Math.random() - .5) * 12}rem;animation-duration:${14 + Math.random() * 16}s;animation-delay:${-Math.random() * 30}s;transform:scale(${.6 + Math.random() * .9})`;
  $('lichter').append(l);
}

let cfg = null, offset = 0, listKey = '', queue = [], nextAt = 0, bgUrl = null;
async function poll() {
  try {
    let v = await (await fetch('/api/startscreen', { cache: 'no-store' })).json();
    if (params.has('demo')) { const n = Date.now(); v = { ...v, show: true, startedAt: n, until: n + 3 * 60_000, now: n }; }
    offset = v.now - Date.now(); // Serverzeit minus Zeit dieses Rechners
    cfg = v;
  } catch { /* beim nächsten Mal wieder */ }
}
const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
function showSpruch(t) {
  const card = $('spruch'); card.classList.remove('in');
  setTimeout(() => { $('sHead').textContent = t.head; $('sBody').textContent = t.text; card.classList.add('in'); }, 650);
}
function frame() {
  requestAnimationFrame(frame);
  const scene = $('scene');
  if (!cfg || !cfg.show) { scene.classList.remove('on'); return; }
  scene.classList.add('on');
  if (cfg.bg !== bgUrl) { // Hintergrund wechselt: Bild, abgeschottete HTML-Datei oder der eingebaute Abend
    bgUrl = cfg.bg;
    const bg = $('bg'); bg.classList.toggle('plain', !bgUrl); bg.replaceChildren(); bg.style.backgroundImage = '';
    $('lichter').style.display = bgUrl ? 'none' : '';
    if (bgUrl && cfg.bgKind === 'html') { const f = document.createElement('iframe'); f.src = bgUrl; f.setAttribute('sandbox', 'allow-scripts'); f.setAttribute('scrolling', 'no'); f.tabIndex = -1; bg.appendChild(f); }
    else if (bgUrl) bg.style.backgroundImage = `url("${bgUrl}")`;
  }
  $('title').textContent = cfg.title; $('sub').textContent = cfg.subtitle;
  const now = Date.now() + offset;
  const left = Math.max(0, cfg.until - now), total = Math.max(1, cfg.until - cfg.startedAt), done = left <= 0;
  const s = Math.ceil(left / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  $('karte').classList.toggle('done', done);
  $('time').textContent = done ? cfg.endText : (h ? `${h}:${two(m)}:${two(s % 60)}` : `${two(m)}:${two(s % 60)}`);
  $('progress').style.display = cfg.showProgress ? '' : 'none';
  const pct = done ? 100 : Math.min(100, Math.max(0, ((now - cfg.startedAt) / total) * 100));
  $('fill').style.width = `${pct}%`; $('stift').style.left = `${pct}%`;
  $('phase').textContent = done ? '🎉 Es kann losgehen!' : `${[...PHASES].reverse().find(([from]) => pct >= from)[1]} · ${Math.floor(pct)} %`;
  // Schreib-Sprüche: gemischt der Reihe nach, bei neuer Liste wird neu gemischt
  const key = JSON.stringify(cfg.anecdotes);
  if (key !== listKey) { listKey = key; queue = []; nextAt = 0; }
  const card = $('spruch');
  if (!cfg.anecdotes.length || done) { card.style.display = 'none'; return; }
  card.style.display = '';
  if (performance.now() >= nextAt) { if (!queue.length) queue = shuffle(cfg.anecdotes); showSpruch(queue.shift()); nextAt = performance.now() + Math.max(4, cfg.rotateSeconds) * 1000; }
}
poll(); setInterval(poll, 4000); frame();
</script>
</body>
</html>
