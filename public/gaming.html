<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gaming-Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- OBS: Browser-Quelle 1920×1080 mit /gaming. Darunter (von unten): Spiel-Aufnahme (16:9), darüber die Kamera (quadratisch zugeschnitten).
     Kamerafenster, Größe und Deathcounter stellst du im Admin ein (Gaming-Szene). Zum Ausprobieren in der Adresse:
     ?kamera=oben-links,unten-rechts (oder aus) · &groesse=340 · &design=glas · &hintergrund=obs&abdunkeln=25 · ?platzhalter=1 zeigt die Fenster · ?demo=1 Beispieldaten ohne Bot. -->
<style>
@font-face { font-family: Fredoka; font-weight: 500; src: url(fonts/fredoka-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { GamingOverlay } from './js/gaming-ui.mjs';
import { ECKEN } from './js/gaming.mjs';
import { applyDesign } from './js/design.mjs';

const q = new URLSearchParams(location.search);
const demo = q.has('demo');
const stage = document.getElementById('stage');
const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
addEventListener('resize', fit); fit();

const ov = new GamingOverlay(stage, { platzhalter: q.has('platzhalter') || demo });
// Einstellungen kommen aus dem Admin; Adressparameter überschreiben sie zum Ausprobieren.
function mix(view) {
  const g = { ...(view.gaming ?? {}) };
  if (q.has('kamera')) g.kameras = q.get('kamera').split(',').map((s) => s.trim()).filter((s) => ECKEN.includes(s));
  if (q.has('design')) g.design = q.get('design');
  if (q.has('hintergrund')) g.hintergrund = q.get('hintergrund');
  if (q.has('abdunkeln')) g.abdunkeln = Math.min(80, Math.max(0, Number(q.get('abdunkeln')) || 0));
  if (q.get('groesse')) g.groesse = Math.min(700, Math.max(160, Number(q.get('groesse')) || 340));
  return { ...view, gaming: g };
}
function zeige(view) {
  applyDesign(document.documentElement, view.design); // Farben, Rundung und Schrift der Karten wie im Overlay
  ov.update(mix(view));
}
const demoView = () => ({
  jahreszeit: q.get('jahreszeit') ?? 'fruehling', tageszeit: q.get('tageszeit') ?? 'mittag', progress: Number(q.get('fortschritt') ?? 0.55), timer: { phase: 'idle' },
  gaming: { kameras: ['oben-rechts'], groesse: 340, tode: { n: 7, label: 'Tode', pos: 'unten-links' } },
});
async function poll() {
  try { const r = await fetch('/api/overlay', { cache: 'no-store' }); if (r.ok) zeige(await r.json()); } catch { /* beim nächsten Mal wieder */ }
}
if (demo) zeige(demoView());
else {
  await poll(); setInterval(poll, 3000);
  // Der Server meldet Änderungen aus Admin, Chat und Hotkey sofort; der Abruf alle 3 Sekunden bleibt als Rückfall.
  try { const live = new EventSource('/api/overlay/live'); for (const k of ['settings', 'event']) live.addEventListener(k, poll); } catch { /* dann eben nur der Abruf */ }
}
</script>
</body>
</html>
