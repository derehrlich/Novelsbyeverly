<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- OBS: eigene Browser-Quelle mit https://…/alerts (1920×1080), getrennt vom Overlay. Hintergrund ist durchsichtig.
     Texte, Schrift, Größe und Position stellt der Admin unter „Alerts“ ein. Vorschau im Admin: ?vorschau=1 -->
<style>
@font-face { font-family: Fredoka; font-weight: 400; src: url(fonts/fredoka-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 500; src: url(fonts/fredoka-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
/* Buch-Sprites: public/alerts/buch-aufklappen.png (8 Bilder à 220×280, Anker = Buchrücken unten) */
#buch { --s: 2.4; --schrift: Fredoka, system-ui, sans-serif; --gn: 1; --gl: 1; --gs: 1; --cname: #4d4236; --clabel: #b0745a; --csub: #7a6b57;
  position: absolute; left: 960px; top: 30px; width: calc(220px * var(--s)); height: calc(240px * var(--s)); margin-left: calc(-110px * var(--s)); pointer-events: none; opacity: 0; will-change: transform, opacity; font-family: var(--schrift); }
#buch .sprite { position: absolute; inset: 0; background: url(alerts/buch-aufklappen.png) 0 calc(-40px * var(--s)) / calc(1760px * var(--s)) calc(280px * var(--s)) no-repeat; }
#buch .glow { position: absolute; left: calc(40px * var(--s)); top: calc(40px * var(--s)); width: calc(140px * var(--s)); height: calc(120px * var(--s)); background: radial-gradient(ellipse at 50% 85%, rgba(255, 224, 140, .95), rgba(255, 200, 110, .45) 45%, rgba(255, 200, 110, 0) 72%); filter: blur(calc(4px * var(--s))); opacity: 0; mix-blend-mode: screen; }
#buch .seite { position: absolute; top: calc(83px * var(--s)); width: calc(66px * var(--s)); height: calc(104px * var(--s)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; transition: opacity .5s ease; overflow: hidden; }
#buch .seite.l { left: calc(50px * var(--s)); transform: rotate(-1.5deg); }
#buch .seite.r { left: calc(123px * var(--s)); transform: rotate(1.2deg); }
#buch .seite.an { opacity: 1; }
#buch .label { font-size: calc(9px * var(--s) * var(--gl) * var(--fl, 1)); font-weight: 600; color: var(--clabel); line-height: 1.15; max-width: 100%; overflow-wrap: anywhere; }
#buch .name { font-size: calc(14px * var(--s) * var(--gn) * var(--lang, 1)); font-weight: 700; color: var(--cname); line-height: 1.1; max-width: 100%; overflow-wrap: normal; }
#buch .sub { font-size: calc(8.5px * var(--s) * var(--gs) * var(--fl, 1)); font-weight: 500; color: var(--csub); line-height: 1.2; max-width: 100%; overflow-wrap: anywhere; }
#buch .zier { width: calc(30px * var(--s)); height: 2px; background: #c9a45f; border-radius: 2px; margin: calc(5px * var(--s)) 0; opacity: .8; }
#buch .zier + .sub { margin-top: 0; }
#konfetti { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="buch"><div class="glow"></div><div class="sprite"></div><div class="seite l"></div><div class="seite r"></div></div>
  <canvas id="konfetti" width="1920" height="1080"></canvas>
</div>

<script type="module">
import { alertSchrift, alertTexte, DEFAULT_ALERTS, normalizeAlerts } from './js/alerts.mjs';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const stage = $('stage');
const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
addEventListener('resize', fit); fit();

let cfg = DEFAULT_ALERTS, cursor = null;

// ---- Konfetti
const kc = $('konfetti').getContext('2d');
let parts = [];
function burst(x, y, n = 80, spread = 1) {
  const cols = ['#d9a6a4', '#e3cf91', '#9db4bf', '#a3b896', '#b6a4c4', '#d9a77c'];
  for (let i = 0; i < n; i += 1) {
    const a = Math.random() * Math.PI * 2, v = (4 + Math.random() * 9) * spread;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: 6 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 0 });
  }
}
let sichtbar = false;
function stepConfetti() {
  if (!parts.length && !sichtbar) return;
  sichtbar = parts.length > 0;
  kc.clearRect(0, 0, 1920, 1080);
  parts = parts.filter((p) => p.life < 150 && p.y < 1100);
  for (const p of parts) {
    p.life += 1; p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    kc.save(); kc.translate(p.x, p.y); kc.rotate(p.rot); kc.globalAlpha = Math.min(1, (150 - p.life) / 40);
    kc.fillStyle = p.c; kc.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); kc.restore();
  }
}
(function loop() { requestAnimationFrame(loop); stepConfetti(); })();

// ---- Das Buch: hereingleiten, aufklappen, Text auf die Seiten, zeigen, zuklappen, hinausgleiten
const BUCH_W = 220;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const easeOut = (x) => 1 - (1 - x) ** 3, easeInOut = (x) => (x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const tween = (ms, fn) => new Promise((res) => { const t0 = performance.now(); (function step(now) { const x = Math.min(1, (now - t0) / ms); fn(x); x < 1 ? requestAnimationFrame(step) : res(); })(t0); });

function anwenden(c) { // Schrift, Größen, Farben und Position aus den Einstellungen
  const el = $('buch'), s = 2.4 * c.groesseBuch / 100;
  el.style.setProperty('--s', s); el.style.setProperty('--schrift', alertSchrift(c));
  el.style.setProperty('--gn', c.groesseName / 100); el.style.setProperty('--gl', c.groesseLabel / 100); el.style.setProperty('--gs', c.groesseSub / 100);
  el.style.setProperty('--cname', c.textFarbe); el.style.setProperty('--clabel', c.labelFarbe); el.style.setProperty('--csub', c.subFarbe);
  el.style.left = `${960 + c.x}px`; el.style.top = `${30 + c.y}px`;
  return s;
}

async function playBook({ label, name, sub, dauer, konfetti }) {
  const c = cfg, s = anwenden(c);
  const el = $('buch'), sprite = el.querySelector('.sprite'), glow = el.querySelector('.glow');
  const [L, R] = el.querySelectorAll('.seite');
  const setFrame = (f) => { // der Buchrücken bleibt fest, das geschlossene Buch sitzt rechts davon: beim Öffnen sanft zur Mitte schieben
    sprite.style.backgroundPositionX = `${-Math.round(f) * BUCH_W * s}px`; el.style.marginLeft = `${-(110 + 38 * (1 - Math.min(f, 6) / 6)) * s}px`;
  };
  L.innerHTML = '<div class="label"></div><div class="zier"></div><div class="sub"></div>';
  L.querySelector('.label').textContent = label; L.querySelector('.sub').textContent = sub;
  L.querySelector('.label').hidden = !label; L.querySelector('.zier').hidden = !label || !sub; L.querySelector('.sub').hidden = !sub;
  R.innerHTML = '<div class="name"></div>'; const nm = R.querySelector('.name'); nm.textContent = name;
  // Zu langer Text: Schrift so lange verkleinern, bis er auf die Seite passt (Name nach Breite, linke Seite nach Höhe)
  const passt = (el, box, v, ziel) => { let f = 1; el.style.setProperty(v, 1); while (f > .3 && (ziel === 'b' ? el.scrollWidth > box.clientWidth - 2 || box.scrollHeight > box.clientHeight + 1 : box.scrollHeight > box.clientHeight + 1)) { f -= .05; el.style.setProperty(v, f.toFixed(2)); } };
  passt(nm, R, '--lang', 'b');
  if (nm.scrollWidth > R.clientWidth - 2) { nm.style.overflowWrap = 'anywhere'; passt(nm, R, '--lang', 'h'); } // ein einziges sehr langes Wort: zur Not umbrechen
  passt(L, L, '--fl', 'h');
  L.classList.remove('an'); R.classList.remove('an'); glow.style.opacity = 0; setFrame(0);
  const cx = 960 + c.x;
  try {
    el.style.opacity = 0;
    await tween(520, (x) => { const e = easeOut(x); el.style.opacity = Math.min(1, x * 2.2); el.style.transform = `translateY(${(1 - e) * -160}px) scale(${.85 + .15 * e})`; });
    await wait(150);
    await tween(900, (x) => setFrame(easeInOut(x) * 6));
    setFrame(7);
    tween(600, (x) => { glow.style.opacity = easeOut(x); });
    if (konfetti) burst(cx, 270 + c.y, konfetti, 1.1);
    await wait(250); L.classList.add('an'); await wait(180); R.classList.add('an');
    await wait(dauer);
    L.classList.remove('an'); R.classList.remove('an'); tween(500, (x) => { glow.style.opacity = 1 - x; });
    await wait(420);
    await tween(800, (x) => setFrame((1 - easeInOut(x)) * 6));
    setFrame(0);
    await tween(420, (x) => { const e = x * x; el.style.opacity = 1 - e; el.style.transform = `translateY(${e * -120}px) scale(${1 - .08 * e})`; });
  } finally { el.style.opacity = 0; }
}

// ---- Warteschlange: mehrere Alerts kurz hintereinander laufen nacheinander
const queue = [];
let laeuft = false;
async function naechster() {
  if (laeuft) return;
  laeuft = true;
  while (queue.length) { try { await playBook(queue.shift()); } catch (e) { console.error(e); } await wait(300); }
  laeuft = false;
}
function handleEvent(ev, { test = ev?.test } = {}) {
  const t = alertTexte(ev, cfg, { test });
  if (t) { queue.push(t); naechster(); }
}

// ---- Daten vom Server (Einstellungen und Ereignisse), genau wie beim Overlay
let entwurf = null; // Vorschau im Admin: ungespeicherte Einstellungen haben Vorrang
async function poll() {
  try {
    const res = await fetch(`/api/overlay${cursor ? `?since=${encodeURIComponent(cursor)}` : ''}`, { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (!entwurf) cfg = normalizeAlerts(data.alerts);
    if (data.cursor) cursor = data.cursor;
    for (const ev of data.events ?? []) handleEvent(ev);
  } catch { /* beim nächsten Mal wieder */ }
}
await poll();
setInterval(poll, 3000);
try { const live = new EventSource('/api/overlay/live'); for (const k of ['settings', 'event']) live.addEventListener(k, poll); } catch { /* dann eben nur der Abruf */ }

// Admin-Vorschau: Entwurf übernehmen und Probe-Alerts abspielen
addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'alerts') { entwurf = normalizeAlerts(e.data.alerts); cfg = entwurf; anwenden(cfg); }
  if (e.data?.type === 'abspielen' && e.data.ereignis) handleEvent(e.data.ereignis, { test: true });
});
if (q.has('vorschau')) document.documentElement.dataset.vorschau = '1';
if (q.get('ereignis')) setTimeout(() => handleEvent({ type: q.get('ereignis'), name: q.get('name') ?? 'Lena', monate: 3, anzahl: 5, bits: 500, zuschauer: 42, nachricht: 'Viel Erfolg beim Schreiben!' }, { test: true }), 400);
anwenden(cfg);
</script>
</body>
</html>
