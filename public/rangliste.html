<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rangliste · Novels by Everly</title>
<meta name="description" content="Die treuesten Mitschreibenden: Besuche, Streaks und Punkte des Monats.">
<style>
@font-face { font-family: Fredoka; font-weight: 400; src: url(fonts/fredoka-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
:root { --bg: #f6ecda; --karte: #fffaf0; --rand: #8b5e3c; --text: #4a3320; --leise: #8c7358; --akzent: #c0704a; --gold: #b98a2e; }
@media (prefers-color-scheme: dark) { :root { --bg: #2a2018; --karte: #382b20; --rand: #c49a70; --text: #f1e4d0; --leise: #bda583; --gold: #e0b45a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 Fredoka, system-ui, sans-serif; }
/* ?overlay: durchsichtig und ohne Kopf (für eine OBS-Browserquelle) */
body.overlay { background: transparent; overflow: hidden; }
body.overlay header, body.overlay .foot { display: none; }
header { text-align: center; padding: 28px 16px 4px; }
header small { color: var(--leise); font-weight: 600; letter-spacing: .04em; }
h1 { margin: 2px 0 0; font-size: 32px; }
main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 48px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
section.karte { background: var(--karte); border: 3px solid var(--rand); border-radius: 18px; padding: 16px 20px 18px; box-shadow: 0 5px 0 rgba(60, 35, 15, .18); }
section.karte.monat { grid-column: 1 / -1; }
h2 { font-size: 21px; margin: 0 0 10px; }
ol { list-style: none; margin: 0; padding: 0; counter-reset: r; }
li { counter-increment: r; display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(139, 94, 60, .25); }
li:last-child { border-bottom: 0; }
li::before { content: counter(r); width: 28px; flex: none; text-align: right; font-weight: 700; font-size: .9rem; color: var(--leise); }
li:nth-child(1)::before { content: '🥇'; } li:nth-child(2)::before { content: '🥈'; } li:nth-child(3)::before { content: '🥉'; }
li span { overflow-wrap: anywhere; } li b { margin-left: auto; white-space: nowrap; color: var(--gold); }
.leise { color: var(--leise); }
details { margin-top: 12px; border-top: 1px solid rgba(139, 94, 60, .25); padding-top: 10px; }
details summary { cursor: pointer; font-weight: 600; color: var(--leise); }
details ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 5px; }
.foot { text-align: center; color: var(--leise); font-size: .9rem; margin-top: 18px; }
</style>
</head>
<body>
<header><small>NOVELS BY EVERLY</small><h1>✍️ Rangliste</h1></header>
<main><div class="grid" id="grid"></div><p class="foot" id="foot"></p></main>
<script>
if (new URLSearchParams(location.search).has('overlay')) document.body.classList.add('overlay');
const fmtMin = (m) => { m = Math.round(m); return m < 60 ? `${m} Min` : m % 60 ? `${Math.floor(m / 60)} Std ${m % 60} Min` : `${Math.floor(m / 60)} Std`; };
const BOARDS = [
  ['visits', 'Treueste Mitschreibende', (v) => `${v}x da`],
  ['streaks', 'Aktuelle Streak 🔥', (v) => `${v} Streams`],
  ['records', 'Streak-Rekord', (v) => `${v} Streams`],
  ['minutes', 'Meiste gemeinsame Arbeitszeit', fmtMin],
  ['words', 'Gemeldete Wörter ✍️', (v) => `${v.toLocaleString('de-DE')}`],
];
const grid = document.getElementById('grid');
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const list = (rows, fmt) => { const ol = el('ol'); for (const r of rows) { const li = el('li'); li.append(el('span', r.name), el('b', fmt(r.value))); ol.append(li); } return ol; };
function legend(r) {
  const gap = r.msgGap >= 60 && r.msgGap % 60 === 0 ? `${r.msgGap / 60} Minute${r.msgGap === 60 ? '' : 'n'}` : `${r.msgGap} Sekunden`;
  const det = el('details'); det.append(el('summary', 'So werden die Punkte gezählt'));
  const ul = el('ul');
  for (const t of [
    `💬 Nachricht im Chat: ${r.msg} Punkt${r.msg === 1 ? '' : 'e'}. Eine Nachricht zählt höchstens alle ${gap}, pro Tag höchstens ${r.msgCap}.`,
    `📅 Aktiver Tag: ${r.day} Punkte für jeden Tag, an dem du geschrieben hast.`,
    `✅ Check-in im Stream: ${r.checkin} Punkte für jeden Stream-Tag.`,
    '🔄 Am Monatsanfang beginnt die Wertung neu.',
  ]) ul.append(el('li', t));
  ul.querySelectorAll('li').forEach((li) => { li.style.cssText = 'display:list-item;border:0;padding:0;list-style:none;counter-increment:none'; li.classList.add('p'); });
  det.append(ul); return det;
}
async function load() {
  try {
    const res = await fetch('/api/rangliste', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 404 ? 'Die Rangliste ist gerade nicht öffentlich.' : 'Die Rangliste konnte nicht geladen werden.');
    const data = await res.json();
    grid.replaceChildren();
    if (data.month) {
      const sec = el('section', null, 'karte monat'); sec.append(el('h2', `Aktivste im ${data.month.label}`));
      sec.append(data.month.rows.length ? list(data.month.rows, (v) => `${v} Punkte`) : el('p', 'Noch keine Punkte in diesem Monat.', 'leise'));
      sec.append(legend(data.month.rules)); grid.append(sec);
    }
    for (const [key, title, fmt] of BOARDS) {
      const sec = el('section', null, 'karte'); sec.append(el('h2', title));
      sec.append(data[key].length ? list(data[key], fmt) : el('p', 'Noch keine Einträge.', 'leise'));
      grid.append(sec);
    }
    document.getElementById('foot').textContent = `${data.visitors} Mitschreibende insgesamt · aktualisiert ${new Date(data.updated).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;
  } catch (e) { grid.replaceChildren(el('p', e.message, 'foot')); }
}
load(); setInterval(load, 60_000);
</script>
</body>
</html>
