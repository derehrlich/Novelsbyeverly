<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stream-Pause</title>
<style>
  /* Stream-Pause als OBS-Browserquelle (z. B. 1920×1080, Hintergrund bleibt durchsichtig).
     Starten und beenden: im Chat mit !auszeit Text und !zurueck (nur Moderation), oder im Admin (Stream → Stream-Pause).
     ?pos=center (Standard) | top | bottom | top-left | top-right | bottom-left | bottom-right   Platz auf dem Bild
     ?size=0.6 … 3   Größe (Standard 1)    ?demo   Beispiel, immer sichtbar */
  @font-face { font-family: Fredoka; font-weight: 400; src: url(fonts/fredoka-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 500; src: url(fonts/fredoka-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
  :root { --papier: rgba(251, 246, 235, .96); --rand: #bba98a; --text: #4d4236; --leise: #8a7b66; --gold: #c9a45f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: Fredoka, system-ui, sans-serif; }
  #box { position: fixed; box-sizing: border-box; display: flex; align-items: center; gap: 30px; padding: 26px 46px 26px 34px; min-width: 560px; max-width: 92vw; background: var(--papier); border: 4px solid var(--rand); border-radius: 36px; box-shadow: 0 16px 40px rgba(50, 40, 28, .32), inset 0 0 0 6px rgba(255, 255, 255, .5); opacity: 0; transition: transform .8s cubic-bezier(.2, 1.1, .3, 1), opacity .5s; --s: 1; transform: var(--out) scale(var(--s)); color: var(--text); }
  #box.on { opacity: 1; transform: var(--in) scale(var(--s)); }
  .tasse { flex: none; width: 150px; height: 150px; }
  .tasse.bild { object-fit: contain; }
  .tasse.emoji { display: flex; align-items: center; justify-content: center; font-size: 110px; line-height: 1; }
  .tasse[hidden] { display: none; }
  .tasse .dampf path { fill: none; stroke: #d9cdb6; stroke-width: 5; stroke-linecap: round; opacity: 0; animation: dampf 3.2s ease-in-out infinite; }
  .tasse .dampf path:nth-child(2) { animation-delay: 1.05s; }
  .tasse .dampf path:nth-child(3) { animation-delay: 2.1s; }
  .inhalt { min-width: 0; }
  .text { font-size: 56px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
  .sub { margin-top: 8px; font-size: 27px; font-weight: 500; color: var(--leise); }
  .sub:empty { display: none; }
  .zeit { margin-top: 14px; display: inline-block; padding: 4px 18px; border-radius: 999px; background: #efe6d2; border: 2px solid var(--rand); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .zeit:empty { display: none; }
  .zierde { position: absolute; left: 34px; right: 46px; bottom: 10px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7; }
  @keyframes dampf { 0% { opacity: 0; transform: translateY(8px); } 30% { opacity: .85; } 100% { opacity: 0; transform: translateY(-16px); } }
</style>
</head>
<body>
<div id="box" aria-live="off">
  <img class="tasse bild" id="bild" alt="" hidden>
  <div class="tasse emoji" id="emoji" hidden></div>
  <svg class="tasse" id="tasse" viewBox="0 0 150 150" aria-hidden="true">
    <g class="dampf"><path d="M52 52 q-9 -12 0 -24 q9 -12 0 -24"/><path d="M75 52 q-9 -12 0 -24 q9 -12 0 -24"/><path d="M98 52 q-9 -12 0 -24 q9 -12 0 -24"/></g>
    <ellipse cx="75" cy="128" rx="58" ry="11" fill="#d8c8a6" stroke="#bba98a" stroke-width="3"/>
    <path d="M26 66 h98 v26 a49 40 0 0 1 -98 0 z" fill="#fffaf0" stroke="#bba98a" stroke-width="4"/>
    <path d="M124 76 h8 a14 14 0 0 1 0 28 h-12" fill="none" stroke="#bba98a" stroke-width="5" stroke-linecap="round"/>
    <path d="M26 66 h98" stroke="#c97b5a" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="75" cy="68" rx="46" ry="5" fill="#9a6a48"/>
    <path d="M44 96 q31 24 62 0" fill="none" stroke="#e7d9bd" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div class="inhalt">
    <div class="text" id="text">Kurze Pause</div>
    <div class="sub" id="sub"></div>
    <div class="zeit" id="zeit"></div>
  </div>
  <div class="zierde"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const box = $('box');
const POS = { // [Ankerstyle, eingeblendet, ausgeblendet]
  center: ['top:50%;left:50%', 'translate(-50%,-50%)', 'translate(-50%,-30%)'],
  top: ['top:36px;left:50%', 'translate(-50%,0)', 'translate(-50%,-160%)'],
  bottom: ['bottom:36px;left:50%', 'translate(-50%,0)', 'translate(-50%,160%)'],
  'top-left': ['top:30px;left:30px', 'translate(0,0)', 'translate(-120%,0)'],
  'top-right': ['top:30px;right:30px', 'translate(0,0)', 'translate(120%,0)'],
  'bottom-left': ['bottom:30px;left:30px', 'translate(0,0)', 'translate(-120%,0)'],
  'bottom-right': ['bottom:30px;right:30px', 'translate(0,0)', 'translate(120%,0)'],
};
const pos = POS[params.get('pos')] ? params.get('pos') : 'center';
const [anchor, tin, tout] = POS[pos];
box.style.cssText += `;${anchor};--in:${tin};--out:${tout};`;
const size = Number(params.get('size')); if (size >= 0.3 && size <= 3) box.style.setProperty('--s', size);
box.style.transformOrigin = { top: '50% 0', bottom: '50% 100%', center: '50% 50%', 'top-left': '0 0', 'top-right': '100% 0', 'bottom-left': '0 100%', 'bottom-right': '100% 100%' }[pos];

let cfg = null, offset = 0;
const DEMO = { show: true, icon: { emoji: params.get('icon') ?? '', url: '' }, text: 'Kurz Trinkpause', sub: 'Gleich geht es weiter!', startedAt: Date.now(), until: Date.now() + 5 * 60_000, now: Date.now() };
async function poll() {
  try {
    const v = params.has('demo') ? DEMO : await (await fetch('/api/pause', { cache: 'no-store' })).json();
    offset = v.now - Date.now(); // Serverzeit minus Zeit dieses Rechners
    cfg = v;
  } catch { /* beim nächsten Mal wieder */ }
}
const two = (n) => String(n).padStart(2, '0');
function frame() {
  requestAnimationFrame(frame);
  if (!cfg || !cfg.show) { box.classList.remove('on'); return; }
  $('text').textContent = cfg.text; $('sub').textContent = cfg.sub;
  const ic = cfg.icon ?? {}; // eigenes Icon der Pause: Bild, sonst Emoji, sonst die Tasse
  $('bild').hidden = !ic.url; if (ic.url && $('bild').dataset.src !== ic.url) { $('bild').dataset.src = ic.url; $('bild').src = ic.url; }
  $('emoji').hidden = Boolean(ic.url) || !ic.emoji; $('emoji').textContent = ic.emoji || '';
  $('tasse').style.display = ic.url || ic.emoji ? 'none' : '';
  if (cfg.until) {
    const left = Math.max(0, cfg.until - (Date.now() + offset)), s = Math.ceil(left / 1000);
    $('zeit').textContent = left > 0 ? `Weiter in etwa ${Math.floor(s / 60)}:${two(s % 60)}` : 'Gleich geht es weiter';
  } else $('zeit').textContent = '';
  box.classList.add('on');
}
poll(); setInterval(poll, 4000); frame();
</script>
</body>
</html>
