# Everly-Bot auf CasaOS. In CasaOS: App-Store → „Benutzerdefinierte App installieren" → diese Datei einfügen.
# Anleitung: docs/casaos.md. Die Werte mit „HIER_…" vorher durch deine eigenen ersetzen (oder danach in der App unter „Einstellungen").
name: everly
services:
  everly:
    image: ghcr.io/derehrlich/novelsbyeverly:latest
    container_name: everly
    restart: unless-stopped
    ports:
      - "3001:3000" # außen 3001, damit es sich nicht mit der Stadtwache (3000) auf demselben NAS beißt
    volumes:
      # Hier liegen alle Daten (Besucher, Einstellungen, Töne). Dieser Ordner kommt ins Backup und wird nie überschrieben.
      - /DATA/AppData/everly/data:/data
      # Hier landen die nächtlichen Sicherungen. Besser auf einer Freigabe des NAS (anderes Gerät), also den Teil vor dem Doppelpunkt anpassen,
      # z. B. /media/NAS/everly-backups (so heißt die Freigabe in CasaOS unter Dateien → Netzwerk).
      - /DATA/AppData/everly/backups:/backups
    environment:
      LOCAL_STORE_DIR: /data
      BACKUP_DIR: /backups
      TZ: Europe/Berlin
      # Von https://dev.twitch.tv/console/apps
      TWITCH_CLIENT_ID: HIER_CLIENT_ID
      TWITCH_CLIENT_SECRET: HIER_CLIENT_SECRET
      # 10 bis 100 Zeichen, frei gewählt (derselbe Wert wie bisher bei Netlify, sonst müssen die Webhooks neu angelegt werden)
      EVENTSUB_SECRET: HIER_EVENTSUB_GEHEIMWORT
      # Langes Passwort für den Admin-Bereich
      ADMIN_PASSWORD: HIER_ADMIN_PASSWORT
      # Öffentliche Adresse mit https, ohne Schrägstrich am Ende
      SITE_URL: https://bot.example.de
      # Optional: Schlüssel für die Schnittstellen /api/words (Papyrus-Hilfsprogramm) und /api/musik
      INGEST_TOKEN: ""
      # Update-Knopf im Admin: Adresse von Watchtower (siehe docker-compose.watchtower.yml) und derselbe Schlüssel wie dort
      WATCHTOWER_URL: http://192.168.178.144:8081
      WATCHTOWER_TOKEN: HIER_UPDATE_SCHLUESSEL
    # Nur nötig, was der Everly-Bot wirklich braucht
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

x-casaos:
  architectures:
    - amd64
  main: everly
  author: Novels by Everly
  category: Twitch
  description:
    de_de: Co-Working-Bot und Overlay mit Check-in, Streak, Punkten und Rangliste
    en_us: Co-working bot and overlay with check-in, streak, points and leaderboard
  title:
    custom: Everly-Bot
  port_map: "3000"
  index: /admin/
