# Co-Working-Overlay für CasaOS (oder jeden Docker-Rechner).
# CasaOS: App Store → „Eigene App installieren“ (oben rechts) → diese Datei einfügen. Oder per Terminal: docker compose up -d --build
services:
  overlay:
    build: .
    image: novelsbyeverly:latest
    container_name: novelsbyeverly
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      ADMIN_PASSWORD: "bitte-aendern"          # Passwort für /admin/ (lang wählen)
      TWITCH_CLIENT_ID: ""                      # aus https://dev.twitch.tv/console/apps (Client Type: Public)
      TWITCH_CLIENT_SECRET: ""                  # leer lassen bei Public; nur bei „Confidential“ nötig
      INGEST_TOKEN: ""                          # optional: Schlüssel für /api/words und /api/musik (Hilfsprogramme)
      TZ: "Europe/Berlin"
    volumes:
      - ./data:/data                            # CasaOS: z. B. /DATA/AppData/novelsbyeverly/data:/data
    x-casaos:
      title:
        de_de: Co-Working-Overlay
      description:
        de_de: Stream-Overlay, Admin-Oberfläche und Twitch-Bot für Schreib- und Co-Working-Streams.
      category: Media
      port_map: "8888"
      index: /admin/
x-casaos:
  architectures: [amd64, arm64]
  main: overlay
  author: derehrlich
  category: Media
  tagline:
    de_de: Overlay und Bot für Schreib-Streams
  title:
    de_de: Co-Working-Overlay
